name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate skills
        run: python3 scripts/validate.py
      - name: Run tests
        run: |
          python3 -m pip install pytest==9.1.1
          python3 -m pytest -q
